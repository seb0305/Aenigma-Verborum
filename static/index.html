<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aenigma prototype</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Aenigma Prototype</h1>

  <button id="btnHomeVocab" class="nav-btn">My Vocab Book</button>
  <button id="btnHomeQuiz" class="nav-btn">Start Multiple Choice Quiz</button>
  <button id="btnHomeSorting" class="nav-btn">Start Sorting Quiz</button>
  <button id="btnHomeCards" class="nav-btn">My Cards</button>

  <section id="vocabSection" style="display:none;">
    <h2>Vocab Book</h2>
    <form id="addVocabForm">
      <input name="latin" placeholder="Latin" required>
      <input name="german" placeholder="German (optional)">
      <button type="submit">Add</button>
    </form>
<table id="vocabTable">
  <thead>
    <tr>
      <th>Latin</th>
      <th>German</th>
      <th>Accuracy</th>
      <th>Card</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
  </section>

<section id="quizSection" class="panel">
  <h2>Quiz</h2>
  <div id="quizWord"></div>
  <div id="quizOptions"></div>
  <div id="quizFeedback"></div>
  <button id="btnNextQuestion" style="display:none;">Next</button>
</section>

<section id="sortingSection" style="display:none;" class="panel">
  <h2>Verb Sorting Quiz</h2>
  <div id="sortingQuizArea" class="sorting-area">
    <!-- Draggable Verb Card -->
    <div id="verbCard" class="verb-card" draggable="true">
      audire
    </div>

    <!-- Drop Categories -->
    <div id="categories" class="categories-container">
      <div class="category-box" data-category="A-Konjugation">A-Konjugation</div>
      <div class="category-box" data-category="E-Konjugation">E-Konjugation</div>
      <div class="category-box" data-category="I-Konjugation">I-Konjugation</div>
      <div class="category-box" data-category="konsonantische Konjugation">konsonantische Konjugation</div>
    </div>

    <!-- Feedback -->
    <div id="sortingFeedback" class="feedback"></div>
  </div>
</section>

  <section id="cardsSection" style="display:none;">
    <h2>My Cards</h2>
    <div id="cardsGrid"></div>
  </section>

  <script src="/static/script.js"></script>
</body>
</html>
